<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'">
  <title>Webinars - CRM Webinar & Training</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>CRM System</h1>
        <p id="user-name">Welcome</p>
      </div>
      <nav class="sidebar-nav">
        <a class="nav-item" data-page="dashboard"><span>Dashboard</span></a>
        <a class="nav-item" data-page="contacts"><span>Contacts</span></a>
        <a class="nav-item active" data-page="webinars"><span>Webinars</span></a>
        <a class="nav-item" data-page="training"><span>Training</span></a>
        <a class="nav-item" data-page="messages"><span>Messages</span></a>
        <a class="nav-item" id="logout-btn"><span>Logout</span></a>
      </nav>
    </aside>

    <main class="main-content">
      <div class="page-header">
        <h2 class="page-title">Webinars</h2>
        <button class="btn btn-primary" id="create-webinar-btn">Schedule Webinar</button>
      </div>

      <!-- Filter Tabs -->
      <div class="tabs">
        <div class="tab active" data-filter="all">All</div>
        <div class="tab" data-filter="scheduled">Scheduled</div>
        <div class="tab" data-filter="live">Live</div>
        <div class="tab" data-filter="completed">Completed</div>
      </div>

      <!-- Webinars List -->
      <div id="webinars-container">
        <div class="loading">
          <div class="spinner"></div>
          <p>Loading webinars...</p>
        </div>
      </div>
    </main>
  </div>

  <!-- Create/Edit Webinar Modal -->
  <div id="webinar-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title" id="webinar-modal-title">Schedule Webinar</h3>
        <button class="modal-close" id="close-webinar-modal">&times;</button>
      </div>
      <div class="modal-body">
        <form id="webinar-form">
          <input type="hidden" id="webinar-id">
          <div class="form-group">
            <label for="webinar-title">Title</label>
            <input type="text" id="webinar-title" class="form-control" required>
          </div>

          <div class="form-group">
            <label for="webinar-description">Description</label>
            <textarea id="webinar-description" class="form-control" rows="3"></textarea>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="webinar-date">Date & Time</label>
              <input type="datetime-local" id="webinar-date" class="form-control" required>
            </div>
            <div class="form-group">
              <label for="webinar-duration">Duration (minutes)</label>
              <input type="number" id="webinar-duration" class="form-control" value="60" min="15" max="480">
            </div>
          </div>

          <div class="form-group">
            <label for="webinar-max-attendees">Max Attendees</label>
            <input type="number" id="webinar-max-attendees" class="form-control" value="100" min="1">
          </div>

          <div class="form-group">
            <label for="webinar-link">Meeting Link (optional)</label>
            <input type="url" id="webinar-link" class="form-control" placeholder="https://...">
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="cancel-webinar">Cancel</button>
        <button class="btn btn-primary" id="save-webinar">Save Webinar</button>
      </div>
    </div>
  </div>

  <!-- Attendees Modal -->
  <div id="attendees-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">Manage Attendees</h3>
        <button class="modal-close" id="close-attendees-modal">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>Add Attendee</label>
          <select id="add-attendee-select" class="form-control">
            <option value="">Select a contact...</option>
          </select>
          <button class="btn btn-success btn-sm" style="margin-top: 10px;" id="add-attendee-btn">Add</button>
        </div>
        <h4 style="margin-top: 20px;">Current Attendees</h4>
        <div id="attendees-list">
          <p>No attendees yet</p>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/app.js"></script>
  <script>
    const currentUser = JSON.parse(sessionStorage.getItem('currentUser'));
    if (!currentUser) {
      window.api.navigate('login');
    } else {
      document.getElementById('user-name').textContent = `Welcome, ${currentUser.fullName}`;
    }

    let webinars = [];
    let editingWebinar = null;
    let currentFilter = 'all';
    let selectedWebinarForAttendees = null;
    let contacts = [];

    async function loadWebinars() {
      try {
        webinars = await window.api.webinars.getAll();
        contacts = await window.api.contacts.getAll();
        renderWebinars();
      } catch (error) {
        showNotification('Failed to load webinars', 'danger');
      }
    }

    function renderWebinars() {
      const container = document.getElementById('webinars-container');
      let filteredWebinars = webinars;

      if (currentFilter !== 'all') {
        filteredWebinars = webinars.filter(w => w.status === currentFilter);
      }

      if (filteredWebinars.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <h3>No webinars found</h3>
            <p>Schedule your first webinar to get started</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filteredWebinars.map(webinar => `
        <div class="card">
          <div class="card-header">
            <h3 class="card-title">${escapeHtml(webinar.title)}</h3>
            <span class="badge ${getStatusBadgeClass(webinar.status)}">${webinar.status.toUpperCase()}</span>
          </div>
          <p style="margin-bottom: 15px; color: #7f8c8d;">${escapeHtml(webinar.description || 'No description')}</p>
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 15px;">
            <div>
              <strong>Host:</strong> ${escapeHtml(webinar.host_name || 'Unknown')}
            </div>
            <div>
              <strong>Date:</strong> ${formatDateTime(webinar.scheduled_date)}
            </div>
            <div>
              <strong>Duration:</strong> ${webinar.duration} minutes
            </div>
            <div>
              <strong>Max Attendees:</strong> ${webinar.max_attendees}
            </div>
          </div>
          ${webinar.meeting_link ? `<p><strong>Meeting Link:</strong> <a href="${escapeHtml(webinar.meeting_link)}" target="_blank">${escapeHtml(webinar.meeting_link)}</a></p>` : ''}
          <div class="actions" style="margin-top: 15px;">
            ${webinar.status === 'scheduled' ? `
              <button class="btn btn-success btn-sm" onclick="startWebinar('${webinar.id}')">Start</button>
            ` : ''}
            ${webinar.status === 'live' ? `
              <button class="btn btn-danger btn-sm" onclick="endWebinar('${webinar.id}')">End</button>
            ` : ''}
            <button class="btn btn-primary btn-sm" onclick="manageAttendees('${webinar.id}')">Attendees</button>
            <button class="btn btn-warning btn-sm" onclick="editWebinar('${webinar.id}')">Edit</button>
            <button class="btn btn-danger btn-sm" onclick="deleteWebinar('${webinar.id}')">Delete</button>
          </div>
        </div>
      `).join('');
    }

    // Filter tabs
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentFilter = tab.getAttribute('data-filter');
        renderWebinars();
      });
    });

    // Create webinar modal
    document.getElementById('create-webinar-btn').addEventListener('click', () => {
      editingWebinar = null;
      document.getElementById('webinar-modal-title').textContent = 'Schedule Webinar';
      document.getElementById('webinar-form').reset();
      document.getElementById('webinar-id').value = '';
      document.getElementById('webinar-modal').classList.add('show');
    });

    window.editWebinar = function(id) {
      editingWebinar = webinars.find(w => w.id === id);
      if (!editingWebinar) return;

      document.getElementById('webinar-modal-title').textContent = 'Edit Webinar';
      document.getElementById('webinar-id').value = editingWebinar.id;
      document.getElementById('webinar-title').value = editingWebinar.title;
      document.getElementById('webinar-description').value = editingWebinar.description || '';

      const date = new Date(editingWebinar.scheduled_date);
      document.getElementById('webinar-date').value = date.toISOString().slice(0, 16);

      document.getElementById('webinar-duration').value = editingWebinar.duration;
      document.getElementById('webinar-max-attendees').value = editingWebinar.max_attendees;
      document.getElementById('webinar-link').value = editingWebinar.meeting_link || '';

      document.getElementById('webinar-modal').classList.add('show');
    };

    window.deleteWebinar = async function(id) {
      if (await confirmAction('Are you sure you want to delete this webinar?')) {
        const result = await window.api.webinars.delete(id);
        if (result.success) {
          showNotification('Webinar deleted successfully', 'success');
          loadWebinars();
        } else {
          showNotification(result.error || 'Failed to delete webinar', 'danger');
        }
      }
    };

    window.startWebinar = async function(id) {
      const result = await window.api.webinars.startWebinar(id);
      if (result.success) {
        showNotification('Webinar started!', 'success');
        loadWebinars();
      } else {
        showNotification(result.error || 'Failed to start webinar', 'danger');
      }
    };

    window.endWebinar = async function(id) {
      if (await confirmAction('Are you sure you want to end this webinar?')) {
        const result = await window.api.webinars.endWebinar(id);
        if (result.success) {
          showNotification('Webinar ended', 'success');
          loadWebinars();
        } else {
          showNotification(result.error || 'Failed to end webinar', 'danger');
        }
      }
    };

    window.manageAttendees = async function(webinarId) {
      selectedWebinarForAttendees = webinarId;
      const attendees = await window.api.webinars.getAttendees(webinarId);

      // Populate contact dropdown
      const select = document.getElementById('add-attendee-select');
      select.innerHTML = '<option value="">Select a contact...</option>';
      contacts.forEach(contact => {
        const isAttending = attendees.some(a => a.id === contact.id);
        if (!isAttending) {
          select.innerHTML += `<option value="${contact.id}">${escapeHtml(contact.first_name)} ${escapeHtml(contact.last_name)} (${escapeHtml(contact.email)})</option>`;
        }
      });

      // Render attendees list
      const listContainer = document.getElementById('attendees-list');
      if (attendees.length === 0) {
        listContainer.innerHTML = '<p>No attendees yet</p>';
      } else {
        listContainer.innerHTML = attendees.map(a => `
          <div style="display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #eee;">
            <span>${escapeHtml(a.first_name)} ${escapeHtml(a.last_name)} - ${escapeHtml(a.email)}</span>
            <button class="btn btn-danger btn-sm" onclick="removeAttendee('${a.id}')">Remove</button>
          </div>
        `).join('');
      }

      document.getElementById('attendees-modal').classList.add('show');
    };

    document.getElementById('add-attendee-btn').addEventListener('click', async () => {
      const contactId = document.getElementById('add-attendee-select').value;
      if (!contactId) {
        showNotification('Please select a contact', 'warning');
        return;
      }

      const result = await window.api.webinars.addAttendee(selectedWebinarForAttendees, contactId);
      if (result.success) {
        showNotification('Attendee added', 'success');
        manageAttendees(selectedWebinarForAttendees);
      } else {
        showNotification(result.error || 'Failed to add attendee', 'danger');
      }
    });

    window.removeAttendee = async function(contactId) {
      const result = await window.api.webinars.removeAttendee(selectedWebinarForAttendees, contactId);
      if (result.success) {
        showNotification('Attendee removed', 'success');
        manageAttendees(selectedWebinarForAttendees);
      } else {
        showNotification(result.error || 'Failed to remove attendee', 'danger');
      }
    };

    // Save webinar
    document.getElementById('save-webinar').addEventListener('click', async () => {
      const form = document.getElementById('webinar-form');
      if (!form.checkValidity()) {
        form.reportValidity();
        return;
      }

      const webinarData = {
        title: document.getElementById('webinar-title').value,
        description: document.getElementById('webinar-description').value,
        hostId: currentUser.id,
        scheduledDate: document.getElementById('webinar-date').value,
        duration: parseInt(document.getElementById('webinar-duration').value),
        maxAttendees: parseInt(document.getElementById('webinar-max-attendees').value),
        meetingLink: document.getElementById('webinar-link').value
      };

      let result;
      if (editingWebinar) {
        result = await window.api.webinars.update(editingWebinar.id, webinarData);
      } else {
        result = await window.api.webinars.create(webinarData);
      }

      if (result.success) {
        showNotification(editingWebinar ? 'Webinar updated' : 'Webinar scheduled', 'success');
        document.getElementById('webinar-modal').classList.remove('show');
        loadWebinars();
      } else {
        showNotification(result.error || 'Failed to save webinar', 'danger');
      }
    });

    // Close modals
    document.getElementById('close-webinar-modal').addEventListener('click', () => {
      document.getElementById('webinar-modal').classList.remove('show');
    });

    document.getElementById('cancel-webinar').addEventListener('click', () => {
      document.getElementById('webinar-modal').classList.remove('show');
    });

    document.getElementById('close-attendees-modal').addEventListener('click', () => {
      document.getElementById('attendees-modal').classList.remove('show');
    });

    // Navigation
    document.querySelectorAll('.nav-item[data-page]').forEach(item => {
      item.addEventListener('click', () => {
        window.api.navigate(item.getAttribute('data-page'));
      });
    });

    document.getElementById('logout-btn').addEventListener('click', async () => {
      if (currentUser) await window.api.auth.logout(currentUser.id);
      sessionStorage.removeItem('currentUser');
      window.api.navigate('login');
    });

    loadWebinars();
  </script>
</body>
</html>
