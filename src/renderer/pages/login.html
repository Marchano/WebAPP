<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'">
  <title>CRM Webinar & Training - Login</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div class="login-container">
    <div class="login-box">
      <div class="login-header">
        <h1>CRM Webinar & Training</h1>
        <p>Sign in to your account</p>
      </div>

      <div id="alert-container"></div>

      <form id="login-form" class="login-form">
        <div class="form-group">
          <label for="username">Username or Email</label>
          <input type="text" id="username" class="form-control" required placeholder="Enter username or email">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" required placeholder="Enter password">
        </div>

        <button type="submit" class="btn btn-primary">Sign In</button>
      </form>

      <div class="login-footer">
        <p>Don't have an account? <a href="#" id="show-register">Create one</a></p>
      </div>
    </div>
  </div>

  <!-- Registration Modal -->
  <div id="register-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">Create Account</h3>
        <button class="modal-close" id="close-register">&times;</button>
      </div>
      <div class="modal-body">
        <form id="register-form">
          <div class="form-group">
            <label for="reg-fullname">Full Name</label>
            <input type="text" id="reg-fullname" class="form-control" required>
          </div>

          <div class="form-group">
            <label for="reg-username">Username</label>
            <input type="text" id="reg-username" class="form-control" required>
          </div>

          <div class="form-group">
            <label for="reg-email">Email</label>
            <input type="email" id="reg-email" class="form-control" required>
          </div>

          <div class="form-group">
            <label for="reg-password">Password</label>
            <input type="password" id="reg-password" class="form-control" required minlength="6">
          </div>

          <div class="form-group">
            <label for="reg-confirm">Confirm Password</label>
            <input type="password" id="reg-confirm" class="form-control" required>
          </div>

          <button type="submit" class="btn btn-success">Create Account</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    // Store user session
    const sessionStorage = window.sessionStorage;

    // Show alert
    function showAlert(message, type = 'danger') {
      const alertContainer = document.getElementById('alert-container');
      alertContainer.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
      setTimeout(() => {
        alertContainer.innerHTML = '';
      }, 5000);
    }

    // Login form handler
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        const result = await window.api.auth.login({ username, password });

        if (result.success) {
          sessionStorage.setItem('currentUser', JSON.stringify(result.user));
          window.api.navigate('dashboard');
        } else {
          showAlert(result.error || 'Login failed');
        }
      } catch (error) {
        showAlert('An error occurred. Please try again.');
      }
    });

    // Show registration modal
    document.getElementById('show-register').addEventListener('click', (e) => {
      e.preventDefault();
      document.getElementById('register-modal').classList.add('show');
    });

    // Close registration modal
    document.getElementById('close-register').addEventListener('click', () => {
      document.getElementById('register-modal').classList.remove('show');
    });

    // Registration form handler
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const fullName = document.getElementById('reg-fullname').value;
      const username = document.getElementById('reg-username').value;
      const email = document.getElementById('reg-email').value;
      const password = document.getElementById('reg-password').value;
      const confirm = document.getElementById('reg-confirm').value;

      if (password !== confirm) {
        showAlert('Passwords do not match');
        return;
      }

      try {
        const result = await window.api.auth.register({
          fullName,
          username,
          email,
          password
        });

        if (result.success) {
          document.getElementById('register-modal').classList.remove('show');
          showAlert('Account created successfully! You can now log in.', 'success');
          document.getElementById('register-form').reset();
        } else {
          showAlert(result.error || 'Registration failed');
        }
      } catch (error) {
        showAlert('An error occurred. Please try again.');
      }
    });

    // Close modal on outside click
    document.getElementById('register-modal').addEventListener('click', (e) => {
      if (e.target.id === 'register-modal') {
        document.getElementById('register-modal').classList.remove('show');
      }
    });
  </script>
</body>
</html>
