<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'">
  <title>Training - CRM Webinar & Training</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>CRM System</h1>
        <p id="user-name">Welcome</p>
      </div>
      <nav class="sidebar-nav">
        <a class="nav-item" data-page="dashboard"><span>Dashboard</span></a>
        <a class="nav-item" data-page="contacts"><span>Contacts</span></a>
        <a class="nav-item" data-page="webinars"><span>Webinars</span></a>
        <a class="nav-item active" data-page="training"><span>Training</span></a>
        <a class="nav-item" data-page="messages"><span>Messages</span></a>
        <a class="nav-item" id="logout-btn"><span>Logout</span></a>
      </nav>
    </aside>

    <main class="main-content">
      <div class="page-header">
        <h2 class="page-title">Training Courses</h2>
        <button class="btn btn-primary" id="create-course-btn">Create Course</button>
      </div>

      <div id="courses-container">
        <div class="loading">
          <div class="spinner"></div>
          <p>Loading courses...</p>
        </div>
      </div>
    </main>
  </div>

  <!-- Create/Edit Course Modal -->
  <div id="course-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title" id="course-modal-title">Create Course</h3>
        <button class="modal-close" id="close-course-modal">&times;</button>
      </div>
      <div class="modal-body">
        <form id="course-form">
          <input type="hidden" id="course-id">
          <div class="form-group">
            <label for="course-title">Title</label>
            <input type="text" id="course-title" class="form-control" required>
          </div>

          <div class="form-group">
            <label for="course-description">Description</label>
            <textarea id="course-description" class="form-control" rows="3"></textarea>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="course-category">Category</label>
              <select id="course-category" class="form-control">
                <option value="general">General</option>
                <option value="sales">Sales</option>
                <option value="marketing">Marketing</option>
                <option value="technical">Technical</option>
                <option value="leadership">Leadership</option>
                <option value="compliance">Compliance</option>
              </select>
            </div>
            <div class="form-group">
              <label for="course-difficulty">Difficulty</label>
              <select id="course-difficulty" class="form-control">
                <option value="beginner">Beginner</option>
                <option value="intermediate">Intermediate</option>
                <option value="advanced">Advanced</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="course-duration">Duration (hours)</label>
            <input type="number" id="course-duration" class="form-control" value="1" min="1">
          </div>

          <div class="form-group">
            <label>
              <input type="checkbox" id="course-published"> Publish Course
            </label>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="cancel-course">Cancel</button>
        <button class="btn btn-primary" id="save-course">Save Course</button>
      </div>
    </div>
  </div>

  <!-- Modules Modal -->
  <div id="modules-modal" class="modal">
    <div class="modal-content" style="max-width: 800px;">
      <div class="modal-header">
        <h3 class="modal-title">Course Modules</h3>
        <button class="modal-close" id="close-modules-modal">&times;</button>
      </div>
      <div class="modal-body">
        <button class="btn btn-success btn-sm" id="add-module-btn" style="margin-bottom: 15px;">Add Module</button>
        <div id="modules-list">
          <p>No modules yet</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Add Module Modal -->
  <div id="add-module-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title" id="module-modal-title">Add Module</h3>
        <button class="modal-close" id="close-add-module-modal">&times;</button>
      </div>
      <div class="modal-body">
        <form id="module-form">
          <input type="hidden" id="module-id">
          <div class="form-group">
            <label for="module-title">Title</label>
            <input type="text" id="module-title" class="form-control" required>
          </div>

          <div class="form-group">
            <label for="module-content">Content</label>
            <textarea id="module-content" class="form-control" rows="6"></textarea>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="module-order">Order</label>
              <input type="number" id="module-order" class="form-control" value="1" min="1">
            </div>
            <div class="form-group">
              <label for="module-duration">Duration (minutes)</label>
              <input type="number" id="module-duration" class="form-control" value="30" min="1">
            </div>
          </div>

          <div class="form-group">
            <label for="module-video">Video URL (optional)</label>
            <input type="url" id="module-video" class="form-control">
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="cancel-module">Cancel</button>
        <button class="btn btn-primary" id="save-module">Save Module</button>
      </div>
    </div>
  </div>

  <!-- Enrollments Modal -->
  <div id="enrollments-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">Course Enrollments</h3>
        <button class="modal-close" id="close-enrollments-modal">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>Enroll Contact</label>
          <select id="enroll-contact-select" class="form-control">
            <option value="">Select a contact...</option>
          </select>
          <button class="btn btn-success btn-sm" style="margin-top: 10px;" id="enroll-btn">Enroll</button>
        </div>
        <h4 style="margin-top: 20px;">Current Enrollments</h4>
        <div id="enrollments-list">
          <p>No enrollments yet</p>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/app.js"></script>
  <script>
    const currentUser = JSON.parse(sessionStorage.getItem('currentUser'));
    if (!currentUser) {
      window.api.navigate('login');
    } else {
      document.getElementById('user-name').textContent = `Welcome, ${currentUser.fullName}`;
    }

    let courses = [];
    let contacts = [];
    let editingCourse = null;
    let selectedCourseForModules = null;
    let selectedCourseForEnrollments = null;
    let editingModule = null;

    async function loadCourses() {
      try {
        courses = await window.api.training.getAllCourses();
        contacts = await window.api.contacts.getAll();
        renderCourses();
      } catch (error) {
        showNotification('Failed to load courses', 'danger');
      }
    }

    function renderCourses() {
      const container = document.getElementById('courses-container');

      if (courses.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <h3>No courses found</h3>
            <p>Create your first training course to get started</p>
          </div>
        `;
        return;
      }

      container.innerHTML = courses.map(course => `
        <div class="card">
          <div class="card-header">
            <h3 class="card-title">${escapeHtml(course.title)}</h3>
            <span class="badge ${course.is_published ? 'badge-success' : 'badge-warning'}">
              ${course.is_published ? 'Published' : 'Draft'}
            </span>
          </div>
          <p style="margin-bottom: 15px; color: #7f8c8d;">${escapeHtml(course.description || 'No description')}</p>
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 15px;">
            <div><strong>Instructor:</strong> ${escapeHtml(course.instructor_name || 'Unknown')}</div>
            <div><strong>Category:</strong> ${escapeHtml(course.category)}</div>
            <div><strong>Difficulty:</strong> <span class="badge badge-info">${escapeHtml(course.difficulty)}</span></div>
            <div><strong>Duration:</strong> ${course.duration_hours} hours</div>
            <div><strong>Modules:</strong> ${course.module_count || 0}</div>
            <div><strong>Enrollments:</strong> ${course.enrollment_count || 0}</div>
          </div>
          <div class="actions">
            <button class="btn btn-primary btn-sm" onclick="manageCourseModules('${course.id}')">Modules</button>
            <button class="btn btn-success btn-sm" onclick="manageEnrollments('${course.id}')">Enrollments</button>
            <button class="btn btn-warning btn-sm" onclick="editCourse('${course.id}')">Edit</button>
            <button class="btn btn-danger btn-sm" onclick="deleteCourse('${course.id}')">Delete</button>
          </div>
        </div>
      `).join('');
    }

    // Create course modal
    document.getElementById('create-course-btn').addEventListener('click', () => {
      editingCourse = null;
      document.getElementById('course-modal-title').textContent = 'Create Course';
      document.getElementById('course-form').reset();
      document.getElementById('course-id').value = '';
      document.getElementById('course-modal').classList.add('show');
    });

    window.editCourse = function(id) {
      editingCourse = courses.find(c => c.id === id);
      if (!editingCourse) return;

      document.getElementById('course-modal-title').textContent = 'Edit Course';
      document.getElementById('course-id').value = editingCourse.id;
      document.getElementById('course-title').value = editingCourse.title;
      document.getElementById('course-description').value = editingCourse.description || '';
      document.getElementById('course-category').value = editingCourse.category;
      document.getElementById('course-difficulty').value = editingCourse.difficulty;
      document.getElementById('course-duration').value = editingCourse.duration_hours;
      document.getElementById('course-published').checked = editingCourse.is_published;

      document.getElementById('course-modal').classList.add('show');
    };

    window.deleteCourse = async function(id) {
      if (await confirmAction('Are you sure you want to delete this course? This will also delete all modules and enrollments.')) {
        const result = await window.api.training.deleteCourse(id);
        if (result.success) {
          showNotification('Course deleted', 'success');
          loadCourses();
        } else {
          showNotification(result.error || 'Failed to delete course', 'danger');
        }
      }
    };

    // Save course
    document.getElementById('save-course').addEventListener('click', async () => {
      const form = document.getElementById('course-form');
      if (!form.checkValidity()) {
        form.reportValidity();
        return;
      }

      const courseData = {
        title: document.getElementById('course-title').value,
        description: document.getElementById('course-description').value,
        instructorId: currentUser.id,
        category: document.getElementById('course-category').value,
        difficulty: document.getElementById('course-difficulty').value,
        durationHours: parseInt(document.getElementById('course-duration').value),
        isPublished: document.getElementById('course-published').checked
      };

      let result;
      if (editingCourse) {
        result = await window.api.training.updateCourse(editingCourse.id, courseData);
      } else {
        result = await window.api.training.createCourse(courseData);
      }

      if (result.success) {
        showNotification(editingCourse ? 'Course updated' : 'Course created', 'success');
        document.getElementById('course-modal').classList.remove('show');
        loadCourses();
      } else {
        showNotification(result.error || 'Failed to save course', 'danger');
      }
    });

    // Modules management
    window.manageCourseModules = async function(courseId) {
      selectedCourseForModules = courseId;
      const modules = await window.api.training.getModules(courseId);

      const listContainer = document.getElementById('modules-list');
      if (modules.length === 0) {
        listContainer.innerHTML = '<p>No modules yet. Add your first module!</p>';
      } else {
        listContainer.innerHTML = modules.map(m => `
          <div class="card" style="margin-bottom: 10px;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <div>
                <strong>${m.order_index}. ${escapeHtml(m.title)}</strong>
                <p style="color: #7f8c8d; margin: 5px 0;">${truncateText(m.content || 'No content', 150)}</p>
                <small>Duration: ${m.duration_minutes} min</small>
              </div>
              <div class="actions">
                <button class="btn btn-warning btn-sm" onclick="editModule('${m.id}')">Edit</button>
                <button class="btn btn-danger btn-sm" onclick="deleteModule('${m.id}')">Delete</button>
              </div>
            </div>
          </div>
        `).join('');
      }

      document.getElementById('modules-modal').classList.add('show');
    };

    document.getElementById('add-module-btn').addEventListener('click', () => {
      editingModule = null;
      document.getElementById('module-modal-title').textContent = 'Add Module';
      document.getElementById('module-form').reset();
      document.getElementById('module-id').value = '';
      document.getElementById('add-module-modal').classList.add('show');
    });

    window.editModule = async function(moduleId) {
      const modules = await window.api.training.getModules(selectedCourseForModules);
      editingModule = modules.find(m => m.id === moduleId);
      if (!editingModule) return;

      document.getElementById('module-modal-title').textContent = 'Edit Module';
      document.getElementById('module-id').value = editingModule.id;
      document.getElementById('module-title').value = editingModule.title;
      document.getElementById('module-content').value = editingModule.content || '';
      document.getElementById('module-order').value = editingModule.order_index;
      document.getElementById('module-duration').value = editingModule.duration_minutes;
      document.getElementById('module-video').value = editingModule.video_url || '';

      document.getElementById('add-module-modal').classList.add('show');
    };

    window.deleteModule = async function(moduleId) {
      if (await confirmAction('Delete this module?')) {
        const result = await window.api.training.deleteModule(moduleId);
        if (result.success) {
          showNotification('Module deleted', 'success');
          manageCourseModules(selectedCourseForModules);
        } else {
          showNotification(result.error || 'Failed to delete module', 'danger');
        }
      }
    };

    document.getElementById('save-module').addEventListener('click', async () => {
      const form = document.getElementById('module-form');
      if (!form.checkValidity()) {
        form.reportValidity();
        return;
      }

      const moduleData = {
        title: document.getElementById('module-title').value,
        content: document.getElementById('module-content').value,
        orderIndex: parseInt(document.getElementById('module-order').value),
        durationMinutes: parseInt(document.getElementById('module-duration').value),
        videoUrl: document.getElementById('module-video').value
      };

      let result;
      if (editingModule) {
        result = await window.api.training.updateModule(editingModule.id, moduleData);
      } else {
        result = await window.api.training.addModule(selectedCourseForModules, moduleData);
      }

      if (result.success) {
        showNotification(editingModule ? 'Module updated' : 'Module added', 'success');
        document.getElementById('add-module-modal').classList.remove('show');
        manageCourseModules(selectedCourseForModules);
        loadCourses();
      } else {
        showNotification(result.error || 'Failed to save module', 'danger');
      }
    });

    // Enrollments management
    window.manageEnrollments = async function(courseId) {
      selectedCourseForEnrollments = courseId;
      const enrollments = await window.api.training.getEnrollments(courseId);

      const select = document.getElementById('enroll-contact-select');
      select.innerHTML = '<option value="">Select a contact...</option>';
      contacts.forEach(contact => {
        const isEnrolled = enrollments.some(e => e.contact_id === contact.id);
        if (!isEnrolled) {
          select.innerHTML += `<option value="${contact.id}">${escapeHtml(contact.first_name)} ${escapeHtml(contact.last_name)}</option>`;
        }
      });

      const listContainer = document.getElementById('enrollments-list');
      if (enrollments.length === 0) {
        listContainer.innerHTML = '<p>No enrollments yet</p>';
      } else {
        listContainer.innerHTML = enrollments.map(e => `
          <div style="padding: 10px 0; border-bottom: 1px solid #eee;">
            <strong>${escapeHtml(e.first_name)} ${escapeHtml(e.last_name)}</strong>
            <p style="color: #7f8c8d; margin: 5px 0;">${escapeHtml(e.email)}</p>
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <span>Progress: ${e.progress}%</span>
              <span class="badge ${getStatusBadgeClass(e.status)}">${e.status}</span>
            </div>
          </div>
        `).join('');
      }

      document.getElementById('enrollments-modal').classList.add('show');
    };

    document.getElementById('enroll-btn').addEventListener('click', async () => {
      const contactId = document.getElementById('enroll-contact-select').value;
      if (!contactId) {
        showNotification('Please select a contact', 'warning');
        return;
      }

      const result = await window.api.training.enrollContact(selectedCourseForEnrollments, contactId);
      if (result.success) {
        showNotification('Contact enrolled', 'success');
        manageEnrollments(selectedCourseForEnrollments);
        loadCourses();
      } else {
        showNotification(result.error || 'Failed to enroll contact', 'danger');
      }
    });

    // Close modals
    ['close-course-modal', 'cancel-course'].forEach(id => {
      document.getElementById(id).addEventListener('click', () => {
        document.getElementById('course-modal').classList.remove('show');
      });
    });

    document.getElementById('close-modules-modal').addEventListener('click', () => {
      document.getElementById('modules-modal').classList.remove('show');
    });

    ['close-add-module-modal', 'cancel-module'].forEach(id => {
      document.getElementById(id).addEventListener('click', () => {
        document.getElementById('add-module-modal').classList.remove('show');
      });
    });

    document.getElementById('close-enrollments-modal').addEventListener('click', () => {
      document.getElementById('enrollments-modal').classList.remove('show');
    });

    // Navigation
    document.querySelectorAll('.nav-item[data-page]').forEach(item => {
      item.addEventListener('click', () => {
        window.api.navigate(item.getAttribute('data-page'));
      });
    });

    document.getElementById('logout-btn').addEventListener('click', async () => {
      if (currentUser) await window.api.auth.logout(currentUser.id);
      sessionStorage.removeItem('currentUser');
      window.api.navigate('login');
    });

    loadCourses();
  </script>
</body>
</html>
